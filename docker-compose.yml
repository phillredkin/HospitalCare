
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospitalcare-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      mvc:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz && wget -q -O /dev/null http://127.0.0.1/api/auth/csrf"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  mvc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospitalcare-mvc
    ports:
      - "127.0.0.1:5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__DefaultConnection: ${HOSPITALCARE_SQL_CONNECTION_STRING:?Set HOSPITALCARE_SQL_CONNECTION_STRING in the root .env file}
      DataProtection__KeysPath: /app/keys
    volumes:
      - data-protection-keys:/app/keys
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: hospitalcare-ml
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${ML_DATABASE_URL:-postgresql+psycopg://hospitalcare:hospitalcare@ml-db:5432/hospitalcare_ml}
    depends_on:
      ml-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  ml-db:
    image: postgres:17-alpine
    container_name: hospitalcare-ml-db
    environment:
      POSTGRES_USER: hospitalcare
      POSTGRES_PASSWORD: hospitalcare
      POSTGRES_DB: hospitalcare_ml
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ml-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitalcare -d hospitalcare_ml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hospitalcare-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  data-protection-keys:
  ml-db-data:
