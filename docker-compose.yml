services:
  mvc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospitalcare-mvc
    ports:
      - "5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Redis: redis:6379
    depends_on:
      - redis
      - ml-service
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: hospitalcare-ml
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hospitalcare-redis
    restart: unless-stopped