services:
  mvc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospitalcare-mvc
    ports:
      - "5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Redis: redis:6379
    depends_on:
      - redis
      - ml-service
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: hospitalcare-ml
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${ML_DATABASE_URL:-postgresql+psycopg://hospitalcare:hospitalcare@ml-db:5432/hospitalcare_ml}
    depends_on:
      ml-db:
        condition: service_healthy
    restart: unless-stopped

  ml-db:
    image: postgres:17-alpine
    container_name: hospitalcare-ml-db
    environment:
      POSTGRES_USER: hospitalcare
      POSTGRES_PASSWORD: hospitalcare
      POSTGRES_DB: hospitalcare_ml
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ml-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitalcare -d hospitalcare_ml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hospitalcare-redis
    restart: unless-stopped

volumes:
  ml-db-data: